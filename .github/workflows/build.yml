name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install dpkg ldid
          THEOS_DIR="$HOME/theos"
          rm -rf "$THEOS_DIR"
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS_DIR"

      - name: Fetch iOS 10.3 SDK
        run: |
          THEOS_DIR="$HOME/theos"
          rm -rf "$THEOS_DIR/sdks"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git "$THEOS_DIR/sdks"
          git -C "$THEOS_DIR/sdks" sparse-checkout set iPhoneOS10.3.sdk

      - name: Build tweak
        run: |
          THEOS_DIR="$HOME/theos"
          cd "$GITHUB_WORKSPACE"
          make package THEOS="$THEOS_DIR" THEOS_DEVICE_IP=localhost

      - name: Validate .deb
        run: |
          ls -la build/*.deb
          dpkg-deb -I build/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: legacyui-deb
          path: build/*.deb

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.deb \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" build/*.deb --clobber