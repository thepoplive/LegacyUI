name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          brew install dpkg ldid
          export THEOS=$HOME/theos
          rm -rf $THEOS
          git clone --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Fetch iOS 10.3 SDK
        run: |
          export THEOS=$HOME/theos
          rm -rf $THEOS/sdks
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git $THEOS/sdks
          git -C $THEOS/sdks sparse-checkout set iPhoneOS10.3.sdk

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          cd "$GITHUB_WORKSPACE"
          make package

      - name: Validate .deb
        run: |
          ls -la packages/*.deb
          dpkg-deb -I packages/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: legacyui-deb
          path: packages/*.deb

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.deb \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" packages/*.deb --clobber